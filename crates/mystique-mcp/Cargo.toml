[package]
name = "mystique-mcp"
version = "0.1.0"
edition = "2021"
description = "Localhost Streamable HTTP MCP server (external LLM clients)"
publish = false

[dependencies]
mystique-core = { path = "../mystique-core" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util"] }
uuid = { version = "1", features = ["v4"] }
