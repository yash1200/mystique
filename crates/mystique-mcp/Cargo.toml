[package]
name = "mystique-mcp"
version = "0.1.0"
edition = "2021"
description = "Localhost Streamable HTTP MCP server (external LLM clients)"
publish = false

[dependencies]
ts-rs = { version = "12", optional = true, default-features = false, features = ["serde-compat", "serde-json-impl"] }
mystique-core = { path = "../mystique-core" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util"] }
toml_edit = "0.23"
tracing = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[features]
# TypeScript bindings for `pnpm gen:ipc` (ts-rs). Off in normal builds.
ts = ["dep:ts-rs", "mystique-core/ts"]
