[package]
name = "mystique-connector-api"
version = "0.1.0"
edition = "2021"
description = "Stable SPI: traits, DTOs, errors for MystiqueDB engine plugins"
publish = false

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
