[package]
name = "mystique-connector-api"
version = "0.1.0"
edition = "2021"
description = "Stable SPI: traits, DTOs, errors for Mystique engine plugins"
publish = false

[dependencies]
mystique-sql = { path = "../mystique-sql" }
async-trait = "0.1"
csv = "1"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
native-tls = "0.2"
