[package]
name = "mystique-connector-api"
version = "0.1.0"
edition = "2021"
description = "Stable SPI: traits, DTOs, errors for Mystique engine plugins"
publish = false

[dependencies]
mystique-sql = { path = "../mystique-sql" }
mystique-tls = { path = "../mystique-tls" }
async-trait = "0.1"
csv = "1"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
