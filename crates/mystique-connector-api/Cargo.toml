[package]
name = "mystique-connector-api"
version = "0.1.0"
edition = "2021"
description = "Stable SPI: traits, DTOs, errors for Mystique engine plugins"
publish = false

[dependencies]
ts-rs = { version = "12", optional = true, default-features = false, features = ["serde-compat", "serde-json-impl"] }
mystique-sql = { path = "../mystique-sql" }
mystique-tls = { path = "../mystique-tls" }
mystique-transfer = { path = "../mystique-transfer" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[features]
# TypeScript bindings for `pnpm gen:ipc` (ts-rs). Off in normal builds.
ts = ["dep:ts-rs", "mystique-sql/ts", "mystique-tls/ts", "mystique-transfer/ts"]
