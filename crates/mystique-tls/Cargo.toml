[package]
name = "mystique-tls"
version = "0.1.0"
edition = "2021"
description = "TLS settings and native-tls connector for Mystique engine plugins (no SPI dependency)"
publish = false

[dependencies]
ts-rs = { version = "12", optional = true, default-features = false, features = ["serde-compat", "serde-json-impl"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# TypeScript bindings for `pnpm gen:ipc` (ts-rs). Off in normal builds.
ts = ["dep:ts-rs"]
