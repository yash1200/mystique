[package]
name = "mystique-agent"
version = "0.1.0"
edition = "2021"
description = "In-app query-tab agent (Rig + AgentTools)"
publish = false

[dependencies]
ts-rs = { version = "12", optional = true, default-features = false, features = ["serde-compat", "serde-json-impl"] }
mystique-core = { path = "../mystique-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
thiserror = "2"
aes-gcm = "0.10"
base64 = "0.22"
rig = { version = "0.42", default-features = false, features = ["agent", "rustls"] }

[dev-dependencies]
# Plants old pepper-wrapped rows in tests.
rand = "0.8"

[features]
# TypeScript bindings for `pnpm gen:ipc` (ts-rs). Off in normal builds.
ts = ["dep:ts-rs", "mystique-core/ts"]
