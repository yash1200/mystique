[package]
name = "mystique-agent"
version = "0.1.0"
edition = "2021"
description = "In-app query-tab agent (Rig + AgentTools)"
publish = false

[dependencies]
mystique-core = { path = "../mystique-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
thiserror = "2"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
rig = { version = "0.42", default-features = false, features = ["agent", "rustls"] }
