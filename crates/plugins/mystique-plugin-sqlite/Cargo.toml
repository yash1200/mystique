[package]
name = "mystique-plugin-sqlite"
version = "0.1.0"
edition = "2021"
description = "SQLite connector plugin (r2d2 pool)"
publish = false

[dependencies]
mystique-connector-api = { path = "../../mystique-connector-api" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
