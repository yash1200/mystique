[package]
name = "mystique-plugin-sqlite"
version = "0.1.0"
edition = "2021"
description = "SQLite connector plugin (r2d2 pool)"
publish = false

[dependencies]
mystique-connector-api = { path = "../../mystique-connector-api" }
mystique-sql = { path = "../../mystique-sql" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
rusqlite = { workspace = true, features = ["column_decltype"] }
r2d2 = "0.8"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
mystique-plugin-sqlite = { path = ".", features = ["test-support"] }
mystique-conformance = { path = "../../mystique-conformance" }

[features]
# Exposes internals to `tests/`. On only through the dev-dependency above.
test-support = []
