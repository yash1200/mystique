[package]
name = "mystique-plugin-mysql"
version = "0.1.0"
edition = "2021"
description = "MySQL / MariaDB connector plugin (mysql_async pool)"
publish = false

[dependencies]
mystique-connector-api = { path = "../../mystique-connector-api" }
mystique-sql = { path = "../../mystique-sql" }
mystique-tls = { path = "../../mystique-tls" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
mysql_async = { version = "0.36", features = ["native-tls-tls"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
mystique-conformance = { path = "../../mystique-conformance" }
mystique-connector-api = { path = "../../mystique-connector-api" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
