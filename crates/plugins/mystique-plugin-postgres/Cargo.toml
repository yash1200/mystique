[package]
name = "mystique-plugin-postgres"
version = "0.1.0"
edition = "2021"
description = "PostgreSQL connector plugin (deadpool + tokio-postgres)"
publish = false

[dependencies]
mystique-connector-api = { path = "../../mystique-connector-api" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
uuid = { version = "1", default-features = false }
deadpool-postgres = "0.14"
# SSL/TLS for `sslMode=require` (Neon, Supabase, RDS, cloud Postgres)
native-tls = "0.2"
postgres-native-tls = "0.5"
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
futures-util = "0.3"

[dev-dependencies]
mystique-connector-api = { path = "../../mystique-connector-api" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
