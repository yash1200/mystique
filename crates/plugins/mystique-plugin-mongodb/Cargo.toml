[package]
name = "mystique-plugin-mongodb"
version = "0.1.0"
edition = "2021"
description = "MongoDB connector plugin (official driver client pool)"
publish = false

[dependencies]
mystique-connector-api = { path = "../../mystique-connector-api" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
mongodb = { version = "3", default-features = true, features = ["cert-key-password"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
mystique-connector-api = { path = "../../mystique-connector-api" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
