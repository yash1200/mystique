[package]
name = "mystique-core"
version = "0.1.0"
edition = "2021"
description = "Mystique domain logic, local storage, connectors, and application services"
publish = false

[dependencies]
ts-rs = { version = "12", optional = true, default-features = false, features = ["serde-compat", "serde-json-impl"] }
mystique-connector-api = { path = "../mystique-connector-api" }
mystique-plugin-postgres = { path = "../plugins/mystique-plugin-postgres" }
mystique-plugin-sqlite = { path = "../plugins/mystique-plugin-sqlite" }
mystique-plugin-mongodb = { path = "../plugins/mystique-plugin-mongodb" }
mystique-plugin-mysql = { path = "../plugins/mystique-plugin-mysql" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time"] }
async-trait = "0.1"
# keyring 4 `v1` (default): the platform store (macOS keychain, Windows
# Credential Manager, Secret Service), or an error. No in-process mock.
keyring = "4"
russh = { version = "0.65.1", default-features = false, features = ["aws-lc-rs"] }
# Vault envelopes (AES-256-GCM) and the base64 key.
aes-gcm = "0.11"
base64 = "0.23"
rand = "0.10"
tracing = { workspace = true }
# Diagnostics bundle (.tar.gz).
flate2 = "1"
tar = { version = "0.4", default-features = false }

# Attribute-only keychain listing and deletes with user interaction off.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
mystique-core = { path = ".", features = ["test-support"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
# TypeScript bindings for `pnpm gen:ipc` (ts-rs). Off in normal builds.
ts = ["dep:ts-rs", "mystique-connector-api/ts"]
# Exposes internals to `tests/`. On only through the dev-dependency above,
# so normal builds and other crates never see it.
test-support = []
