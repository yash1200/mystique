[package]
name = "mystique-core"
version = "0.1.0"
edition = "2021"
description = "Mystique domain logic, local storage, connectors, and application services"
publish = false

[dependencies]
ts-rs = { version = "12", optional = true, default-features = false, features = ["serde-compat", "serde-json-impl"] }
mystique-connector-api = { path = "../mystique-connector-api" }
mystique-plugin-postgres = { path = "../plugins/mystique-plugin-postgres" }
mystique-plugin-sqlite = { path = "../plugins/mystique-plugin-sqlite" }
mystique-plugin-mongodb = { path = "../plugins/mystique-plugin-mongodb" }
mystique-plugin-mysql = { path = "../plugins/mystique-plugin-mysql" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time"] }
async-trait = "0.1"
# keyring 3 has no default features; without these it uses an in-process mock
# and passwords vanish on restart.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
russh = { version = "0.63.3", default-features = false, features = ["aws-lc-rs"] }
# Vault envelopes (AES-256-GCM) and the base64 key.
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
tracing = { workspace = true }
# Diagnostics bundle (.tar.gz).
flate2 = "1"
tar = { version = "0.4", default-features = false }

# Attribute-only keychain listing and deletes with user interaction off.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
# TypeScript bindings for `pnpm gen:ipc` (ts-rs). Off in normal builds.
ts = ["dep:ts-rs", "mystique-connector-api/ts"]
