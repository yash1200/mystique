[package]
name = "mystique-conformance"
version = "0.1.0"
edition = "2021"
description = "Plugin conformance kit: one suite every engine plugin runs against a live server"
publish = false

# Plugins use this as a dev-dependency only. It never ships in the app.
[dependencies]
mystique-connector-api = { path = "../mystique-connector-api" }
mystique-sql = { path = "../mystique-sql" }
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
