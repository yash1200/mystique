[workspace]
resolver = "2"
members = [
    "crates/mystique-connector-api",
    "crates/mystique-sql",
    "crates/mystique-transfer",
    "crates/mystique-tls",
    "crates/mystique-core",
    "crates/mystique-mcp",
    "crates/mystique-agent",
    "crates/mystique-ipc-gen",
    "crates/plugins/mystique-plugin-postgres",
    "crates/plugins/mystique-plugin-sqlite",
    "crates/plugins/mystique-plugin-mongodb",
    "crates/plugins/mystique-plugin-mysql",
    "src-tauri",
]

# Shared versions for crates that log. `tracing` only emits; the shell
# (`src-tauri`) is the one place that installs a subscriber.
[workspace.dependencies]
tracing = "0.1"
# One SQLite for the app database (mystique-core) and the SQLite plugin.
# 0.41 bundles SQLite 3.54 (RUSTSEC-2026-0459 / CVE-2026-119375). Default
# features off so the wasm-only `sqlite-wasm-rs` backend stays out of the
# graph; `cache` keeps `prepare_cached`.
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std", "tracing-log", "ansi"] }

# Shared release profile for all workspace members.
# `panic = "unwind"` so a plugin bug is caught at the Tauri IPC boundary
# (`src-tauri/src/ipc/mod.rs`, `guard` / `guard_sync`) and returned as
# `internal error: …` instead of aborting the desktop process.
# Do not set this back to "abort" while those guards are the safety net.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true
