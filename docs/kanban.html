<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MystiqueDB — Kanban</title>
  <style>
    :root {
      --bg-app: #0f1219;
      --bg-panel: #161b26;
      --bg-elevated: #1c2333;
      --bg-input: #121722;
      --bg-hover: rgba(255, 255, 255, 0.04);
      --border: #2a3347;
      --border-strong: #3d4a66;
      --fg: #e8ecf4;
      --fg-secondary: #9aa6bd;
      --fg-muted: #6b7690;
      --accent: #5b8def;
      --success: #7fd99a;
      --warning: #e6c07b;
      --danger: #f07178;
      --info: #5b8def;
      --radius: 8px;
      --font: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg-app);
      color: var(--fg);
      min-height: 100vh;
      line-height: 1.4;
      font-size: 13px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    header h1 span {
      color: var(--fg-muted);
      font-weight: 400;
      font-size: 12px;
      margin-left: 8px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      color: var(--fg-muted);
      font-size: 11px;
    }

    .meta a {
      color: var(--accent);
      text-decoration: none;
    }
    .meta a:hover { text-decoration: underline; }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-app);
    }

    .filters button {
      font: inherit;
      font-size: 11px;
      font-family: var(--mono);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--fg-secondary);
      cursor: pointer;
    }
    .filters button:hover { border-color: var(--border-strong); color: var(--fg); }
    .filters button.active {
      background: rgba(91, 141, 239, 0.15);
      border-color: rgba(91, 141, 239, 0.4);
      color: var(--accent);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(240px, 1fr));
      gap: 12px;
      padding: 16px 20px 40px;
      align-items: start;
      overflow-x: auto;
      min-height: calc(100vh - 120px);
    }

    @media (max-width: 1100px) {
      .board {
        grid-template-columns: repeat(4, minmax(260px, 1fr));
        width: max-content;
        max-width: none;
      }
    }

    .column {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 140px);
      min-width: 240px;
    }

    .column-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .column-head h2 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--fg-muted);
    }

    .column-head .count {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      min-width: 1.5rem;
      height: 1.25rem;
      padding: 0 6px;
      border-radius: 4px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--fg-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .column.todo .column-head h2 { color: var(--fg-secondary); }
    .column.progress .column-head h2 { color: var(--info); }
    .column.qa .column-head h2 { color: var(--warning); }
    .column.deployed .column-head h2 { color: var(--success); }

    .column.progress { border-color: rgba(91, 141, 239, 0.35); }
    .column.qa { border-color: rgba(230, 192, 123, 0.35); }
    .column.deployed { border-color: rgba(127, 217, 154, 0.3); }

    .cards {
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      transition: border-color 0.12s;
    }
    .card:hover { border-color: var(--border-strong); }
    .card.hidden { display: none; }

    .card-id {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      color: var(--fg-muted);
      margin-bottom: 4px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--fg);
      margin-bottom: 8px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 8px;
    }

    .tag {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .tag.fe {
      color: #7aa3f5;
      background: rgba(91, 141, 239, 0.12);
      border-color: rgba(91, 141, 239, 0.35);
    }
    .tag.be {
      color: #9b6de8;
      background: rgba(155, 109, 232, 0.12);
      border-color: rgba(155, 109, 232, 0.35);
    }
    .tag.docs {
      color: var(--fg-secondary);
      background: var(--bg-input);
    }
    .tag.p0 {
      color: var(--danger);
      background: rgba(240, 113, 120, 0.12);
      border-color: rgba(240, 113, 120, 0.4);
    }
    .tag.p1 {
      color: var(--warning);
      background: rgba(230, 192, 123, 0.12);
      border-color: rgba(230, 192, 123, 0.4);
    }
    .tag.p2, .tag.p3 {
      color: var(--fg-muted);
      background: var(--bg-input);
    }

    .card-desc {
      font-size: 12px;
      color: var(--fg-secondary);
      margin-bottom: 6px;
    }

    .card-related {
      font-size: 11px;
      color: var(--fg-muted);
      border-top: 1px solid var(--border);
      padding-top: 6px;
      margin-top: 4px;
    }

    .card-related strong {
      font-weight: 500;
      color: var(--fg-muted);
    }

    .empty {
      text-align: center;
      padding: 24px 12px;
      color: var(--fg-muted);
      font-size: 12px;
    }

    footer {
      padding: 8px 20px 16px;
      font-size: 11px;
      color: var(--fg-muted);
      text-align: center;
    }
  </style>

        related: "F-TAB-5 · depends: T-FE-040",
      },
      {
        id: "T-PROD-001",
        title: "Command palette",
        column: "todo",
        tags: ["fe", "p2"],
        description: "⌘/Ctrl+K jump connections, tables, commands.",
        related: "UI_UX §8.2 · depends: T-FE-003",
      },
    ];

    const COLUMNS = [
      { id: "todo", label: "TODO" },
      { id: "progress", label: "Progress" },
      { id: "qa", label: "QA" },
      { id: "deployed", label: "Deployed" },
    ];

    function tagClass(t) {
      if (t === "fe" || t === "be" || t === "docs") return t;
      if (t.startsWith("p")) return t;
      return "";
    }

    function tagLabel(t) {
      return t.toUpperCase();
    }

    function matchesFilter(ticket, filter) {
      if (filter === "all") return true;
      if (filter === "p2") {
        return ticket.tags.includes("p2") || ticket.tags.includes("p3");
      }
      return ticket.tags.includes(filter);
    }

    function render(filter = "all") {
      const board = document.getElementById("board");
      board.innerHTML = "";

      for (const col of COLUMNS) {
        const colTickets = TICKETS.filter(
          (t) => t.column === col.id && matchesFilter(t, filter)
        );

        const section = document.createElement("section");
        section.className = "column " + col.id;
        section.innerHTML =
          '<div class="column-head"><h2>' +
          col.label +
          '</h2><span class="count">' +
          colTickets.length +
          "</span></div>";

        const cards = document.createElement("div");
        cards.className = "cards";

        if (colTickets.length === 0) {
          cards.innerHTML = '<div class="empty">No tickets</div>';
        } else {
          for (const t of colTickets) {
            const card = document.createElement("article");
            card.className = "card";
            card.dataset.tags = t.tags.join(" ");

            const tagsHtml = t.tags
              .map(
                (tag) =>
                  '<span class="tag ' +
                  tagClass(tag) +
                  '">' +
                  tagLabel(tag) +
                  "</span>"
              )
              .join("");

            card.innerHTML =
              '<div class="card-id">' +
              t.id +
              "</div>" +
              '<div class="card-title">' +
              escapeHtml(t.title) +
              "</div>" +
              '<div class="tags">' +
              tagsHtml +
              "</div>" +
              '<p class="card-desc">' +
              escapeHtml(t.description) +
              "</p>" +
              (t.related
                ? '<div class="card-related"><strong>Related:</strong> ' +
                  escapeHtml(t.related) +
                  "</div>"
                : "");

            cards.appendChild(card);
          }
        }

        section.appendChild(cards);
        board.appendChild(section);
      }
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    document.getElementById("filters").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-filter]");
      if (!btn) return;
      document
        .querySelectorAll("#filters button")
        .forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      render(btn.dataset.filter);
    });

    render("all");
  </script>
</body>
</html>
