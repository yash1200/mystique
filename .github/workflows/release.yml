# Desktop builds for an existing version tag, run by hand
# (Actions › release › Run workflow). Releases are normally published from a
# Mac with `pnpm release` (docs/RELEASING.md), which pushes the tag, so a tag
# push does not start this.
#
# Builds macOS (Apple silicon, Intel), Windows (x64, ARM64) and Linux (x64,
# ARM64: .deb, .rpm, .AppImage), all ad-hoc / unsigned: macOS uses
# signingIdentity "-" from tauri.conf.json. The files go to the tag's release
# (a draft is created if there is none; an existing one, e.g. from
# `pnpm release`, gets the files added and same-named ones replaced). Then
# latest.json is rebuilt once from every updater signature, so parallel jobs
# never race on it and platforms already in it are kept.
#
# Repository secrets (updater key only):
#   TAURI_SIGNING_PRIVATE_KEY           text of ~/.tauri/mystique.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to build (v1.0.3, or 1.0.3)
        required: true

permissions:
  contents: write

env:
  # Tags are v-prefixed (scripts/release.mjs); accept the bare version too.
  TAG: ${{ startsWith(inputs.tag, 'v') && inputs.tag || format('v{0}', inputs.tag) }}
  CARGO_TERM_COLOR: always
  # rust-toolchain.toml lists the macOS targets for local builds; each job
  # installs only its own target.
  RUSTUP_TOOLCHAIN: stable

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, arch: aarch64, bundles: "app,dmg" }
          - { os: macos-latest, target: x86_64-apple-darwin, arch: x64, bundles: "app,dmg" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, arch: x64, bundles: nsis }
          # Cross-compiled: windows-latest has the MSVC ARM64 tools and clang.
          - { os: windows-latest, target: aarch64-pc-windows-msvc, arch: arm64, bundles: nsis }
          - { os: ubuntu-26.04, target: x86_64-unknown-linux-gnu, arch: amd64, bundles: "deb,rpm,appimage" }
          # Native ARM runner: the AppImage tooling does not cross-build.
          - { os: ubuntu-26.04-arm, target: aarch64-unknown-linux-gnu, arch: arm64, bundles: "deb,rpm,appimage" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            libdbus-1-dev pkg-config patchelf file

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - run: >-
          pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Same names as scripts/release.mjs, so a CI build replaces a local one.
      - name: Collect
        shell: bash
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          b=target/${{ matrix.target }}/release/bundle
          mkdir out
          if [ -d "$b/macos" ]; then
            cp "$b/macos/Mystique.app.tar.gz" "out/Mystique_${v}_${{ matrix.arch }}.app.tar.gz"
            cp "$b/macos/Mystique.app.tar.gz.sig" "out/Mystique_${v}_${{ matrix.arch }}.app.tar.gz.sig"
          fi
          find "$b" -mindepth 2 -maxdepth 2 -type f \( -name '*.dmg' -o -name '*-setup.exe' \
            -o -name '*-setup.exe.sig' -o -name '*.deb' -o -name '*.deb.sig' -o -name '*.rpm' \
            -o -name '*.rpm.sig' -o -name '*.AppImage' -o -name '*.AppImage.sig' \) -exec cp {} out/ \;
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Upload to the release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --verify-tag --title "Release ${TAG#v}" --notes "Mystique ${TAG#v}."
          gh release upload "$TAG" out/* --clobber

      - name: latest.json
        run: |
          base="https://github.com/$GH_REPO/releases/download/$TAG"
          gh release download "$TAG" -p latest.json -O latest.json 2>/dev/null \
            || jq -n --arg v "${TAG#v}" --arg n "See https://github.com/$GH_REPO/releases/tag/$TAG" \
              '{version: $v, notes: $n, pub_date: (now | todate), platforms: {}}' > latest.json
          for sig in out/*.sig; do
            f=$(basename "${sig%.sig}")
            case "$f" in
              *_aarch64.app.tar.gz) key=darwin-aarch64 ;;
              *_x64.app.tar.gz) key=darwin-x86_64 ;;
              *_x64-setup.exe) key=windows-x86_64 ;;
              *_arm64-setup.exe) key=windows-aarch64 ;;
              *_amd64.AppImage) key=linux-x86_64 ;;
              *_aarch64.AppImage) key=linux-aarch64 ;;
              # The updater checks "<os>-<arch>-<installer>" before "<os>-<arch>".
              *_amd64.deb) key=linux-x86_64-deb ;;
              *_arm64.deb) key=linux-aarch64-deb ;;
              *.x86_64.rpm) key=linux-x86_64-rpm ;;
              *.aarch64.rpm) key=linux-aarch64-rpm ;;
              *) continue ;;
            esac
            jq --arg k "$key" --arg s "$(cat "$sig")" --arg u "$base/$f" \
              '.platforms[$k] = {signature: $s, url: $u}' latest.json > tmp.json
            mv tmp.json latest.json
          done
          cat latest.json
          gh release upload "$TAG" latest.json --clobber
