[package]
name = "mystique"
version = "0.1.0"
description = "Mystique desktop shell (Tauri)"
authors = ["you"]
edition = "2021"

[lib]
name = "mystique_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mystique-core = { path = "../crates/mystique-core" }
mystique-mcp = { path = "../crates/mystique-mcp" }
mystique-agent = { path = "../crates/mystique-agent" }
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
