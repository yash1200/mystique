[package]
name = "mystique"
version = "0.1.0"
description = "Mystique desktop shell (Tauri)"
authors = ["you"]
edition = "2021"
publish = false

# Release panic policy lives on the workspace `[profile.release]` in ../Cargo.toml
# (`panic = "unwind"`). This shell catches a plugin panic in `src/ipc/mod.rs`
# (`guard` / `guard_sync`) and returns `internal error: …`. A `[profile]` here
# would be ignored.

[lib]
name = "mystique_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mystique-core = { path = "../crates/mystique-core" }
mystique-mcp = { path = "../crates/mystique-mcp" }
mystique-agent = { path = "../crates/mystique-agent" }
mystique-acp = { path = "../crates/mystique-acp" }
tauri = { version = "2.12.5", features = ["image-png"] }
tauri-plugin-opener = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-executor = "0.3.34"
futures-util = "0.3.34"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
